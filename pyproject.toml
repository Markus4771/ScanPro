[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scanpro"
version = "1.4.0.dev0"
description = "SMB input first scan processing server"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "httpx>=0.27"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools]
packages = ["scanpro", "scanpro.services"]

[tool.setuptools.package-data]
scanpro = ["web/*.html"]

[tool.ruff]
line-length = 100
