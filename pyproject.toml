[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scanpro"
version = "0.5.0.dev0"
description = "Modular Linux scan station"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pymupdf>=1.24",
  "Pillow>=10.0",
  "pyzbar>=0.1.9",
  "opencv-python-headless>=4.10",
  "pytesseract>=0.3.13"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools]
packages = ["scanpro", "scanpro.services"]

[tool.setuptools.package-data]
scanpro = ["web/*.html"]

[tool.ruff]
line-length = 100
