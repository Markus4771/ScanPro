<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ScanPro</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f4f6f8;color:#1f2937}
    header{background:#111827;color:#fff;padding:18px 24px}
    main{max-width:1180px;margin:24px auto;padding:0 16px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
    .card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
    h1,h2,h3{margin-top:0}
    button,a.btn{cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:#111827;color:#fff;text-decoration:none;display:inline-block}
    button.secondary,a.secondary{background:#e5e7eb;color:#111827}
    button.danger{background:#b91c1c}
    input,select{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;margin-top:4px}
    input[type=checkbox]{width:auto;margin-right:7px}
    label{display:block;margin:10px 0}
    .check{display:flex;align-items:center;gap:4px}
    .item{padding:12px 0;border-top:1px solid #e5e7eb}
    .item:first-child{border-top:0}
    .muted{color:#6b7280;font-size:.92rem}
    .ok{color:#047857}
    .err{color:#b91c1c}
    .warn{color:#92400e}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:.82rem;background:#e5e7eb}
    .badge.ok{background:#d1fae5;color:#065f46}
    .badge.err{background:#fee2e2;color:#991b1b}
    .badge.off{background:#f3f4f6;color:#6b7280}
    .jobgrid{display:grid;grid-template-columns:120px 120px 1fr auto;gap:12px;align-items:center}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .profilegrid{display:grid;grid-template-columns:1.4fr .8fr .9fr .8fr .7fr 1fr auto;gap:10px;align-items:center}
    .divider{height:1px;background:#e5e7eb;margin:18px 0}
    @media(max-width:900px){.profilegrid{grid-template-columns:1fr 1fr}}
    @media(max-width:760px){.jobgrid,.profilegrid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header>
  <h1>ScanPro <span id="version" class="muted"></span></h1>
</header>
<main>
  <div class="grid">
    <section class="card">
      <h2>Scanner erkennen</h2>
      <div class="row">
        <button onclick="discover()">SANE suchen</button>
        <button class="secondary" onclick="discover('escl')">eSCL suchen</button>
      </div>
      <div id="discovered" class="muted" style="margin-top:12px">Noch keine Suche durchgeführt.</div>
    </section>

    <section class="card">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin-bottom:0">Gespeicherte Scanner</h2>
        <button class="secondary" onclick="loadSaved()">Status aktualisieren</button>
      </div>
      <div id="saved" class="muted" style="margin-top:12px">Lade…</div>
    </section>
  </div>

  <section class="card" style="margin-top:16px">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin-bottom:0">Scanprofile</h2>
      <button class="secondary" onclick="resetProfileForm()">Neues Profil</button>
    </div>

    <div class="grid" style="margin-top:12px">
      <label>Name
        <input id="profileName" placeholder="z. B. Rechnung">
      </label>
      <label>Auflösung
        <select id="profileDpi">
          <option>150</option><option>200</option><option selected>300</option><option>600</option>
        </select>
      </label>
      <label>Farbmodus
        <select id="profileColor">
          <option value="color">Farbe</option>
          <option value="grayscale">Graustufen</option>
          <option value="blackwhite">Schwarzweiß</option>
        </select>
      </label>
      <label>Einzug
        <select id="profileDuplex">
          <option value="false" selected>Einseitig</option>
          <option value="true">Duplex</option>
        </select>
      </label>
    </div>

    <div class="row">
      <label class="check"><input type="checkbox" id="profileOcr" onchange="toggleOcrOptions()"> OCR aktivieren</label>
      <label id="profileOcrLanguageWrap" style="min-width:220px;display:none">OCR-Sprache
        <select id="profileOcrLanguage">
          <option value="deu" selected>Deutsch</option>
          <option value="eng">Englisch</option>
          <option value="deu+eng">Deutsch + Englisch</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="profileRemoveBlank"> Leere Seiten aussortieren</label>
      <label class="check"><input type="checkbox" id="profileSplit" onchange="toggleSplitOptions()"> Trennung aktivieren</label>
      <label id="splitMethodWrap" style="min-width:220px;display:none">Trennmethode
        <select id="profileSplitMethod">
          <option value="patch-t">Patch-T</option>
          <option value="qr">QR-Code</option>
          <option value="barcode">Barcode</option>
          <option value="blank-page">Leerseite</option>
          <option value="manual">Manuell</option>
        </select>
      </label>
    </div>

    <div class="row">
      <label class="check"><input type="checkbox" id="profileAutoRotate"> Automatische Rotation</label>
      <label class="check"><input type="checkbox" id="profileDeskew"> Schiefe Seiten begradigen</label>
      <label class="check"><input type="checkbox" id="profileAutoCrop"> Automatisch zuschneiden</label>
      <label class="check"><input type="checkbox" id="profileRemoveBorders"> Scanner-Ränder entfernen</label>
    </div>

    <div class="grid" style="margin-top:8px">
      <label>Dateinamensvorlage
        <input id="profileFilenameTemplate" value="{date}_{profile}_{job}_{document}" placeholder="{date}_{profile}_{job}_{document}">
        <span class="muted">Variablen: {date}, {time}, {datetime}, {profile}, {job}, {document}, {code}, {code_type}, {ocr_first_line}</span>
      </label>
      <label class="check" style="align-self:end"><input type="checkbox" id="profileUseOcrFirstLine"> OCR-Erstzeile für {ocr_first_line} verwenden</label>
    </div>

    <div class="row">
      <label class="check"><input type="checkbox" id="profileShareEnabled" onchange="toggleProfileShareOptions()"> Eigene SMB-Freigabe auf ScanPro</label>
      <label id="profileShareNameWrap" style="min-width:260px;display:none">Freigabename
        <input id="profileShareName" placeholder="z. B. Rechnungen">
      </label>
    </div>

    <div class="actions">
      <button id="profileSaveButton" onclick="saveProfile()">Profil speichern</button>
      <button class="secondary" onclick="resetProfileForm()">Abbrechen</button>
    </div>
    <input type="hidden" id="profileId">

    <div class="divider"></div>
    <div id="profiles" class="muted">Lade Profile…</div>
  </section>


  <section class="card" style="margin-top:16px">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin-bottom:0">Scanziele</h2>
      <button class="secondary" onclick="resetDestinationForm()">Neues Ziel</button>
    </div>

    <div class="grid" style="margin-top:12px">
      <label>Name
        <input id="destinationName" placeholder="z. B. Archiv">
      </label>
      <label>Typ
        <select id="destinationType" onchange="toggleDestinationFields()">
          <option value="local">Lokaler Ordner</option>
          <option value="smb">SMB-Freigabe</option>
        </select>
      </label>
    </div>

    <div id="destinationLocalFields">
      <label>Lokaler Pfad
        <input id="destinationLocalPath" placeholder="/srv/scans/archiv">
      </label>
    </div>

    <div id="destinationSmbFields" style="display:none">
      <div class="grid">
        <label>Server / IP
          <input id="destinationServer" placeholder="192.168.0.10">
        </label>
        <label>Freigabe
          <input id="destinationShare" placeholder="Scans">
        </label>
        <label>Unterordner
          <input id="destinationSubfolder" placeholder="optional">
        </label>
        <label>Benutzer
          <input id="destinationUsername" placeholder="scanpro">
        </label>
        <label>Passwort
          <input id="destinationPassword" type="password" placeholder="Passwort">
        </label>
        <label>Domäne
          <input id="destinationDomain" placeholder="optional">
        </label>
      </div>
    </div>

    <label class="check"><input type="checkbox" id="destinationEnabled" checked> Ziel aktiv</label>

    <div class="actions">
      <button id="destinationSaveButton" onclick="saveDestination()">Ziel speichern</button>
      <button class="secondary" onclick="resetDestinationForm()">Abbrechen</button>
    </div>
    <input type="hidden" id="destinationId">

    <div class="divider"></div>
    <div id="destinations" class="muted">Lade Scanziele…</div>
  </section>



  <section class="card" style="margin-top:16px">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin-bottom:0">Workflows</h2>
      <button class="secondary" onclick="resetWorkflowForm()">Neuer Workflow</button>
    </div>

    <div class="grid" style="margin-top:12px">
      <label>Name
        <input id="workflowName" placeholder="z. B. Rechnungen zum NAS">
      </label>
      <label>Quelle
        <select id="workflowScanner">
          <option value="">Profil-SMB-Inbox</option>
        </select>
      </label>
      <label>Scanprofil
        <select id="workflowProfile"></select>
      </label>
      <label>Scanziel
        <select id="workflowDestination"></select>
      </label>
    </div>

    <label class="check"><input type="checkbox" id="workflowEnabled" checked> Workflow aktiv</label>

    <div class="actions">
      <button id="workflowSaveButton" onclick="saveWorkflow()">Workflow speichern</button>
      <button class="secondary" onclick="resetWorkflowForm()">Abbrechen</button>
    </div>
    <input type="hidden" id="workflowId">

    <div class="divider"></div>
    <div id="workflows" class="muted">Lade Workflows…</div>
  </section>

  <section class="card" style="margin-top:16px">
    <h2>Testscan</h2>
    <div class="grid">
      <label>Scanner
        <select id="scanScanner"></select>
      </label>
      <label>Scanprofil
        <select id="scanProfile" onchange="applySelectedProfile()">
          <option value="">Manuelle Einstellungen</option>
        </select>
      </label>
      <label>Auflösung
        <select id="dpi">
          <option>150</option><option>200</option><option selected>300</option><option>600</option>
        </select>
      </label>
      <label>Farbmodus
        <select id="color">
          <option value="color">Farbe</option>
          <option value="grayscale">Graustufen</option>
          <option value="blackwhite">Schwarzweiß</option>
        </select>
      </label>
      <label>Einzug
        <select id="duplex">
          <option value="false" selected>Einseitig</option>
          <option value="true">Duplex</option>
        </select>
      </label>
    </div>
    <div id="profileInfo" class="muted" style="margin:8px 0 12px"></div>
    <button onclick="testscan()">Scannen</button>
    <div id="scanResult" style="margin-top:12px"></div>
  </section>

  <section class="card" style="margin-top:16px">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin-bottom:0">Letzte ScanJobs</h2>
      <button class="secondary" onclick="loadJobs()">Aktualisieren</button>
    </div>
    <div id="jobs" class="muted" style="margin-top:12px">Lade…</div>
  </section>
</main>
<script>
let profilesCache=[];
let profileSharesCache=[];
let profileProcessingCache=[];
let profileImageProcessingCache=[];
let profileOcrSettingsCache=[];
let profileNamingSettingsCache=[];
let destinationsCache=[];
let scannersCache=[];
let workflowsCache=[];

async function api(url, options={}) {
  const r = await fetch(url, options);
  const data = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail ?? data));
  return data;
}
async function init(){
  const h=await api('/health'); document.getElementById('version').textContent=h.version;
  await loadSaved(); await loadProfiles(); await loadDestinations(); await loadWorkflows(); await loadJobs();
}
async function discover(driver='sane'){
  const box=document.getElementById('discovered'); box.textContent='Suche…';
  try{
    const data=await api('/api/scanners/discover?driver='+encodeURIComponent(driver));
    if(!data.devices.length){box.innerHTML='<span class="muted">Keine Scanner gefunden.</span>'; return;}
    box.innerHTML='';
    for(const d of data.devices){
      const el=document.createElement('div'); el.className='item';
      el.innerHTML='<strong>'+escapeHtml(d.name)+'</strong><div class="muted">'+escapeHtml(d.address||'keine IP')+' · '+escapeHtml(d.driver)+'</div>';
      const b=document.createElement('button'); b.textContent='Übernehmen'; b.onclick=()=>importScanner(d);
      el.appendChild(b); box.appendChild(el);
    }
  }catch(e){box.innerHTML='<span class="err">'+escapeHtml(e.message)+'</span>'}
}
async function importScanner(d){
  await api('/api/scanners/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
  await loadSaved();
}
async function loadSaved(){
  const [data,status] = await Promise.all([api('/api/scanners'),api('/api/scanners/status')]);
  scannersCache=data;
  populateWorkflowSelectors();
  const statusMap=new Map(status.map(x=>[x.id,x]));
  const box=document.getElementById('saved'); const sel=document.getElementById('scanScanner');
  box.innerHTML=''; sel.innerHTML='';
  if(!data.length){box.innerHTML='<span class="muted">Noch kein Scanner gespeichert.</span>'; return;}
  for(const s of data){
    const st=statusMap.get(s.id)||{};
    const badge=!s.enabled?'<span class="badge off">deaktiviert</span>':st.online?'<span class="badge ok">online</span>':'<span class="badge err">offline</span>';
    const el=document.createElement('div'); el.className='item';
    el.innerHTML='<strong>'+escapeHtml(s.name)+'</strong> '+badge+
      '<div class="muted">'+escapeHtml(s.address||'keine IP')+' · '+escapeHtml(s.driver)+'</div>';
    const actions=document.createElement('div'); actions.className='actions';
    const rename=document.createElement('button'); rename.className='secondary'; rename.textContent='Bearbeiten'; rename.onclick=()=>editScanner(s);
    const toggle=document.createElement('button'); toggle.className='secondary'; toggle.textContent=s.enabled?'Deaktivieren':'Aktivieren'; toggle.onclick=()=>toggleScanner(s);
    const del=document.createElement('button'); del.className='danger'; del.textContent='Löschen'; del.onclick=()=>deleteScanner(s);
    actions.append(rename,toggle,del); el.appendChild(actions); box.appendChild(el);
    if(s.enabled){
      const o=document.createElement('option'); o.value=s.id; o.textContent=s.name; sel.appendChild(o);
    }
  }
}
async function editScanner(s){
  const name=prompt('Scannername',s.name); if(name===null)return;
  const address=prompt('IP/Adresse',s.address||''); if(address===null)return;
  await api('/api/scanners/'+s.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,address})});
  await loadSaved();
}
async function toggleScanner(s){
  await api('/api/scanners/'+s.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:!s.enabled})});
  await loadSaved();
}
async function deleteScanner(s){
  if(!confirm('Scanner "'+s.name+'" wirklich löschen?'))return;
  try{
    await api('/api/scanners/'+s.id,{method:'DELETE'});
    await loadSaved();
  }catch(e){alert(e.message)}
}

function toggleOcrOptions(){
  document.getElementById('profileOcrLanguageWrap').style.display=document.getElementById('profileOcr').checked?'block':'none';
}
function toggleSplitOptions(){
  document.getElementById('splitMethodWrap').style.display=document.getElementById('profileSplit').checked?'block':'none';
}
function toggleProfileShareOptions(){
  const enabled=document.getElementById('profileShareEnabled').checked;
  document.getElementById('profileShareNameWrap').style.display=enabled?'block':'none';
  if(enabled && !document.getElementById('profileShareName').value.trim()){
    document.getElementById('profileShareName').value=document.getElementById('profileName').value.trim();
  }
}
function resetProfileForm(){
  document.getElementById('profileId').value='';
  document.getElementById('profileName').value='';
  document.getElementById('profileDpi').value='300';
  document.getElementById('profileColor').value='color';
  document.getElementById('profileDuplex').value='false';
  document.getElementById('profileOcr').checked=false;
  document.getElementById('profileOcrLanguage').value='deu';
  document.getElementById('profileFilenameTemplate').value='{date}_{profile}_{job}_{document}';
  document.getElementById('profileUseOcrFirstLine').checked=false;
  document.getElementById('profileRemoveBlank').checked=false;
  document.getElementById('profileAutoRotate').checked=false;
  document.getElementById('profileDeskew').checked=false;
  document.getElementById('profileAutoCrop').checked=false;
  document.getElementById('profileRemoveBorders').checked=false;
  document.getElementById('profileSplit').checked=false;
  document.getElementById('profileSplitMethod').value='patch-t';
  document.getElementById('profileShareEnabled').checked=false;
  document.getElementById('profileShareName').value='';
  document.getElementById('profileSaveButton').textContent='Profil speichern';
  toggleOcrOptions();
  toggleSplitOptions();
  toggleProfileShareOptions();
}
async function saveProfile(){
  const id=document.getElementById('profileId').value;
  const name=document.getElementById('profileName').value.trim();
  if(!name){alert('Bitte einen Profilnamen eingeben.');return;}
  const split=document.getElementById('profileSplit').checked;
  const body={
    name,
    dpi:Number(document.getElementById('profileDpi').value),
    color_mode:document.getElementById('profileColor').value,
    duplex:document.getElementById('profileDuplex').value==='true',
    ocr_enabled:document.getElementById('profileOcr').checked,
    split_enabled:split,
    split_method:split?document.getElementById('profileSplitMethod').value:'none'
  };
  try{
    const saved=await api(id?'/api/profiles/'+id:'/api/profiles',{
      method:id?'PATCH':'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    const profileId=Number(id||saved.id);
    const shareEnabled=document.getElementById('profileShareEnabled').checked;
    const shareName=document.getElementById('profileShareName').value.trim()||name;
    await api('/api/profiles/'+profileId+'/share',{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({enabled:shareEnabled,share_name:shareEnabled?shareName:null})
    });
    await api('/api/profiles/'+profileId+'/processing',{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({remove_blank_pages:document.getElementById('profileRemoveBlank').checked})
    });
    await api('/api/profiles/'+profileId+'/image-processing',{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        auto_rotate:document.getElementById('profileAutoRotate').checked,
        deskew:document.getElementById('profileDeskew').checked,
        auto_crop:document.getElementById('profileAutoCrop').checked,
        remove_borders:document.getElementById('profileRemoveBorders').checked
      })
    });
    await api('/api/profiles/'+profileId+'/ocr-settings',{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({language:document.getElementById('profileOcrLanguage').value})
    });
    await api('/api/profiles/'+profileId+'/naming-settings',{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        filename_template:document.getElementById('profileFilenameTemplate').value.trim(),
        use_ocr_first_line:document.getElementById('profileUseOcrFirstLine').checked
      })
    });
    resetProfileForm();
    await loadProfiles();
  }catch(e){alert(e.message)}
}
function editProfile(p){
  document.getElementById('profileId').value=p.id;
  document.getElementById('profileName').value=p.name;
  document.getElementById('profileDpi').value=String(p.dpi);
  document.getElementById('profileColor').value=p.color_mode;
  document.getElementById('profileDuplex').value=String(p.duplex);
  document.getElementById('profileOcr').checked=p.ocr_enabled;
  const ocrSettings=profileOcrSettingsCache.find(x=>x.profile_id===p.id);
  const namingSettings=profileNamingSettingsCache.find(x=>x.profile_id===p.id);
  document.getElementById('profileOcrLanguage').value=ocrSettings?ocrSettings.language:'deu';
  document.getElementById('profileFilenameTemplate').value=namingSettings?namingSettings.filename_template:'{date}_{profile}_{job}_{document}';
  document.getElementById('profileUseOcrFirstLine').checked=!!(namingSettings&&namingSettings.use_ocr_first_line);
  document.getElementById('profileSplit').checked=p.split_enabled;
  document.getElementById('profileSplitMethod').value=p.split_method==='none'?'patch-t':p.split_method;
  const share=profileSharesCache.find(x=>x.profile_id===p.id);
  const processing=profileProcessingCache.find(x=>x.profile_id===p.id);
  const imageProcessing=profileImageProcessingCache.find(x=>x.profile_id===p.id);
  document.getElementById('profileRemoveBlank').checked=!!(processing&&processing.remove_blank_pages);
  document.getElementById('profileAutoRotate').checked=!!(imageProcessing&&imageProcessing.auto_rotate);
  document.getElementById('profileDeskew').checked=!!(imageProcessing&&imageProcessing.deskew);
  document.getElementById('profileAutoCrop').checked=!!(imageProcessing&&imageProcessing.auto_crop);
  document.getElementById('profileRemoveBorders').checked=!!(imageProcessing&&imageProcessing.remove_borders);
  document.getElementById('profileShareEnabled').checked=!!(share&&share.enabled);
  document.getElementById('profileShareName').value=share?share.share_name:p.name;
  document.getElementById('profileSaveButton').textContent='Änderungen speichern';
  toggleOcrOptions();
  toggleSplitOptions();
  toggleProfileShareOptions();
  window.scrollTo({top:document.getElementById('profileName').getBoundingClientRect().top+window.scrollY-120,behavior:'smooth'});
}
async function deleteProfile(p){
  if(!confirm('Scanprofil "'+p.name+'" wirklich löschen?'))return;
  try{
    await api('/api/profiles/'+p.id,{method:'DELETE'});
    await loadProfiles();
  }catch(e){alert(e.message)}
}
async function loadProfiles(){
  const [data,shares,processing,imageProcessing,ocrSettings,namingSettings]=await Promise.all([
    api('/api/profiles'),
    api('/api/profile-shares'),
    api('/api/profile-processing'),
    api('/api/profile-image-processing'),
    api('/api/profile-ocr-settings'),
    api('/api/profile-naming-settings')
  ]);
  profilesCache=data;
  profileSharesCache=shares;
  profileProcessingCache=processing;
  profileImageProcessingCache=imageProcessing;
  profileOcrSettingsCache=ocrSettings;
  profileNamingSettingsCache=namingSettings;
  populateWorkflowSelectors();
  const box=document.getElementById('profiles');
  const sel=document.getElementById('scanProfile');
  const current=sel.value;
  box.innerHTML='';
  sel.innerHTML='<option value="">Manuelle Einstellungen</option>';
  if(!data.length){
    box.innerHTML='<span class="muted">Noch keine Scanprofile angelegt.</span>';
    document.getElementById('profileInfo').textContent='';
    return;
  }
  for(const p of data){
    const split=p.split_enabled?('Trennung: '+splitLabel(p.split_method)):'Trennung: aus';
    const ocrSettings=profileOcrSettingsCache.find(x=>x.profile_id===p.id);
    const ocr=p.ocr_enabled?('OCR: '+(ocrSettings?ocrSettings.language:'deu')):'OCR: aus';
    const processing=profileProcessingCache.find(x=>x.profile_id===p.id);
    const imageProcessing=profileImageProcessingCache.find(x=>x.profile_id===p.id);
    const blank=processing&&processing.remove_blank_pages?'Leerseiten: entfernen':'Leerseiten: behalten';
    const imageFlags=[];
    if(imageProcessing&&imageProcessing.auto_rotate)imageFlags.push('Rotation');
    if(imageProcessing&&imageProcessing.deskew)imageFlags.push('Deskew');
    if(imageProcessing&&imageProcessing.auto_crop)imageFlags.push('Auto-Crop');
    if(imageProcessing&&imageProcessing.remove_borders)imageFlags.push('Ränder');
    const imageText=imageFlags.length?'Bild: '+imageFlags.join(', '):'Bildoptimierung: aus';
    const share=profileSharesCache.find(x=>x.profile_id===p.id);
    const namingSettings=profileNamingSettingsCache.find(x=>x.profile_id===p.id);
    const namingText=namingSettings?('Name: '+namingSettings.filename_template):'Name: {date}_{profile}_{job}_{document}';
    const shareText=share&&share.enabled?('SMB: \\\\SCANPRO\\'+share.share_name):'SMB: aus';
    const el=document.createElement('div'); el.className='item';
    el.innerHTML='<div class="profilegrid">'+
      '<div><strong>'+escapeHtml(p.name)+'</strong></div>'+
      '<div>'+p.dpi+' dpi</div>'+
      '<div>'+escapeHtml(colorLabel(p.color_mode))+'</div>'+
      '<div>'+(p.duplex?'Duplex':'Einseitig')+'</div>'+
      '<div>'+ocr+'<div class="muted">'+blank+'</div><div class="muted">'+escapeHtml(imageText)+'</div></div>'+
      '<div>'+escapeHtml(split)+'<div class="muted">'+escapeHtml(shareText)+'</div><div class="muted">'+escapeHtml(namingText)+'</div></div>'+
      '<div class="actions"></div>'+
      '</div>';
    const actions=el.querySelector('.actions');
    const edit=document.createElement('button'); edit.className='secondary'; edit.textContent='Bearbeiten'; edit.onclick=()=>editProfile(p);
    const del=document.createElement('button'); del.className='danger'; del.textContent='Löschen'; del.onclick=()=>deleteProfile(p);
    actions.append(edit,del);
    box.appendChild(el);
    const opt=document.createElement('option'); opt.value=p.id; opt.textContent=p.name; sel.appendChild(opt);
  }
  if([...sel.options].some(o=>o.value===current))sel.value=current;
  applySelectedProfile();
}
function applySelectedProfile(){
  const id=Number(document.getElementById('scanProfile').value);
  const info=document.getElementById('profileInfo');
  if(!id){info.textContent='';return;}
  const p=profilesCache.find(x=>x.id===id);
  if(!p)return;
  document.getElementById('dpi').value=String(p.dpi);
  document.getElementById('color').value=p.color_mode;
  document.getElementById('duplex').value=String(p.duplex);
  info.textContent=(p.ocr_enabled?'OCR aktiviert · ':'OCR aus · ')+(p.split_enabled?'Trennung: '+splitLabel(p.split_method):'Trennung aus');
}
function colorLabel(v){return ({color:'Farbe',grayscale:'Graustufen',blackwhite:'Schwarzweiß'})[v]||v}
function splitLabel(v){return ({'patch-t':'Patch-T',qr:'QR-Code',barcode:'Barcode','blank-page':'Leerseite',manual:'Manuell',none:'Keine'})[v]||v}


function toggleDestinationFields(){
  const type=document.getElementById('destinationType').value;
  document.getElementById('destinationLocalFields').style.display=type==='local'?'block':'none';
  document.getElementById('destinationSmbFields').style.display=type==='smb'?'block':'none';
}
function resetDestinationForm(){
  document.getElementById('destinationId').value='';
  document.getElementById('destinationName').value='';
  document.getElementById('destinationType').value='local';
  document.getElementById('destinationLocalPath').value='';
  document.getElementById('destinationServer').value='';
  document.getElementById('destinationShare').value='';
  document.getElementById('destinationSubfolder').value='';
  document.getElementById('destinationUsername').value='';
  document.getElementById('destinationPassword').value='';
  document.getElementById('destinationDomain').value='';
  document.getElementById('destinationEnabled').checked=true;
  document.getElementById('destinationSaveButton').textContent='Ziel speichern';
  toggleDestinationFields();
}
function destinationConfigFromForm(){
  const type=document.getElementById('destinationType').value;
  if(type==='local'){
    return {path:document.getElementById('destinationLocalPath').value.trim()};
  }
  return {
    server:document.getElementById('destinationServer').value.trim(),
    share:document.getElementById('destinationShare').value.trim(),
    subfolder:document.getElementById('destinationSubfolder').value.trim(),
    username:document.getElementById('destinationUsername').value.trim(),
    password:document.getElementById('destinationPassword').value,
    domain:document.getElementById('destinationDomain').value.trim()
  };
}
async function saveDestination(){
  const id=document.getElementById('destinationId').value;
  const name=document.getElementById('destinationName').value.trim();
  const type=document.getElementById('destinationType').value;
  if(!name){alert('Bitte einen Namen für das Scanziel eingeben.');return;}
  const body={name,type,enabled:document.getElementById('destinationEnabled').checked,config:destinationConfigFromForm()};
  try{
    await api(id?'/api/destinations/'+id:'/api/destinations',{
      method:id?'PATCH':'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    resetDestinationForm();
    await loadDestinations();
  }catch(e){alert(e.message)}
}
function editDestination(d){
  document.getElementById('destinationId').value=d.id;
  document.getElementById('destinationName').value=d.name;
  document.getElementById('destinationType').value=d.type;
  document.getElementById('destinationEnabled').checked=d.enabled;
  const c=d.config||{};
  document.getElementById('destinationLocalPath').value=c.path||'';
  document.getElementById('destinationServer').value=c.server||'';
  document.getElementById('destinationShare').value=c.share||'';
  document.getElementById('destinationSubfolder').value=c.subfolder||'';
  document.getElementById('destinationUsername').value=c.username||'';
  document.getElementById('destinationPassword').value=c.password==='********'?'********':(c.password||'');
  document.getElementById('destinationDomain').value=c.domain||'';
  document.getElementById('destinationSaveButton').textContent='Änderungen speichern';
  toggleDestinationFields();
}
async function toggleDestination(d){
  await api('/api/destinations/'+d.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:!d.enabled})});
  await loadDestinations();
}
async function deleteDestination(d){
  if(!confirm('Scanziel "'+d.name+'" wirklich löschen?'))return;
  try{
    await api('/api/destinations/'+d.id,{method:'DELETE'});
    await loadDestinations();
  }catch(e){alert(e.message)}
}
async function testDestination(d){
  const box=document.getElementById('destinationTest-'+d.id);
  box.textContent='Teste…';
  try{
    const r=await api('/api/destinations/'+d.id+'/test',{method:'POST'});
    box.innerHTML='<span class="ok">'+escapeHtml(r.message)+'</span>';
  }catch(e){
    box.innerHTML='<span class="err">'+escapeHtml(e.message)+'</span>';
  }
}
async function loadDestinations(){
  const data=await api('/api/destinations');
  destinationsCache=data;
  populateWorkflowSelectors();
  const box=document.getElementById('destinations');
  box.innerHTML='';
  if(!data.length){
    box.innerHTML='<span class="muted">Noch keine Scanziele angelegt.</span>';
    return;
  }
  for(const d of data){
    const c=d.config||{};
    const summary=d.type==='local'?(c.path||'kein Pfad'):('//'+(c.server||'?')+'/'+(c.share||'?')+(c.subfolder?'/'+c.subfolder:''));
    const el=document.createElement('div'); el.className='item';
    el.innerHTML='<strong>'+escapeHtml(d.name)+'</strong> '+
      '<span class="badge '+(d.enabled?'ok':'off')+'">'+(d.enabled?'aktiv':'deaktiviert')+'</span>'+
      '<div class="muted">'+escapeHtml(d.type.toUpperCase())+' · '+escapeHtml(summary)+'</div>'+
      '<div id="destinationTest-'+d.id+'" class="muted" style="margin-top:6px"></div>';
    const actions=document.createElement('div'); actions.className='actions';
    const test=document.createElement('button'); test.className='secondary'; test.textContent='Verbindung testen'; test.onclick=()=>testDestination(d);
    const edit=document.createElement('button'); edit.className='secondary'; edit.textContent='Bearbeiten'; edit.onclick=()=>editDestination(d);
    const toggle=document.createElement('button'); toggle.className='secondary'; toggle.textContent=d.enabled?'Deaktivieren':'Aktivieren'; toggle.onclick=()=>toggleDestination(d);
    const del=document.createElement('button'); del.className='danger'; del.textContent='Löschen'; del.onclick=()=>deleteDestination(d);
    actions.append(test,edit,toggle,del); el.appendChild(actions); box.appendChild(el);
  }
}


function populateWorkflowSelectors(){
  const scannerSel=document.getElementById('workflowScanner');
  const profileSel=document.getElementById('workflowProfile');
  const destinationSel=document.getElementById('workflowDestination');
  if(!scannerSel||!profileSel||!destinationSel)return;

  const scannerCurrent=scannerSel.value;
  scannerSel.innerHTML='<option value="">Profil-SMB-Inbox</option>';
  for(const s of scannersCache.filter(x=>x.enabled)){
    const o=document.createElement('option'); o.value=s.id; o.textContent=s.name; scannerSel.appendChild(o);
  }
  if([...scannerSel.options].some(o=>o.value===scannerCurrent))scannerSel.value=scannerCurrent;

  const profileCurrent=profileSel.value;
  profileSel.innerHTML='';
  for(const p of profilesCache){
    const o=document.createElement('option'); o.value=p.id; o.textContent=p.name; profileSel.appendChild(o);
  }
  if([...profileSel.options].some(o=>o.value===profileCurrent))profileSel.value=profileCurrent;

  const destinationCurrent=destinationSel.value;
  destinationSel.innerHTML='';
  for(const d of destinationsCache.filter(x=>x.enabled)){
    const o=document.createElement('option'); o.value=d.id; o.textContent=d.name; destinationSel.appendChild(o);
  }
  if([...destinationSel.options].some(o=>o.value===destinationCurrent))destinationSel.value=destinationCurrent;
}
function resetWorkflowForm(){
  document.getElementById('workflowId').value='';
  document.getElementById('workflowName').value='';
  document.getElementById('workflowScanner').value='';
  document.getElementById('workflowEnabled').checked=true;
  document.getElementById('workflowSaveButton').textContent='Workflow speichern';
  populateWorkflowSelectors();
}
async function saveWorkflow(){
  const id=document.getElementById('workflowId').value;
  const name=document.getElementById('workflowName').value.trim();
  const profileId=Number(document.getElementById('workflowProfile').value);
  const destinationId=Number(document.getElementById('workflowDestination').value);
  const scannerValue=document.getElementById('workflowScanner').value;
  if(!name){alert('Bitte einen Workflownamen eingeben.');return;}
  if(!profileId){alert('Bitte ein Scanprofil auswählen.');return;}
  if(!destinationId){alert('Bitte ein Scanziel auswählen.');return;}
  const body={
    name,
    scanner_id:scannerValue?Number(scannerValue):null,
    profile_id:profileId,
    destination_id:destinationId,
    enabled:document.getElementById('workflowEnabled').checked
  };
  try{
    await api(id?'/api/workflows/'+id:'/api/workflows',{
      method:id?'PATCH':'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    resetWorkflowForm();
    await loadWorkflows();
  }catch(e){alert(e.message)}
}
function editWorkflow(w){
  document.getElementById('workflowId').value=w.id;
  document.getElementById('workflowName').value=w.name;
  populateWorkflowSelectors();
  document.getElementById('workflowScanner').value=w.scanner_id?String(w.scanner_id):'';
  document.getElementById('workflowProfile').value=String(w.profile_id);
  document.getElementById('workflowDestination').value=String(w.destination_id);
  document.getElementById('workflowEnabled').checked=w.enabled;
  document.getElementById('workflowSaveButton').textContent='Änderungen speichern';
}
async function toggleWorkflow(w){
  await api('/api/workflows/'+w.id,{
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({enabled:!w.enabled})
  });
  await loadWorkflows();
}
async function deleteWorkflow(w){
  if(!confirm('Workflow "'+w.name+'" wirklich löschen?'))return;
  try{
    await api('/api/workflows/'+w.id,{method:'DELETE'});
    await loadWorkflows();
  }catch(e){alert(e.message)}
}
async function runWorkflow(w){
  const out=document.getElementById('workflowRun-'+w.id);
  out.innerHTML='<span class="warn">Workflow läuft…</span>';
  try{
    const r=await api('/api/workflows/'+w.id+'/run',{method:'POST'});
    out.innerHTML='<span class="'+(r.status==='delivered'?'ok':'err')+'">'+escapeHtml(r.status)+'</span>'+
      (r.file_url?' <a class="btn secondary" target="_blank" href="'+r.file_url+'">PDF öffnen</a>':'');
    await loadJobs();
  }catch(e){
    out.innerHTML='<span class="err">'+escapeHtml(e.message)+'</span>';
    await loadJobs();
  }
}
async function loadWorkflows(){
  populateWorkflowSelectors();
  const data=await api('/api/workflows');
  workflowsCache=data;
  const box=document.getElementById('workflows');
  box.innerHTML='';
  if(!data.length){
    box.innerHTML='<span class="muted">Noch keine Workflows angelegt.</span>';
    return;
  }
  for(const w of data){
    const source=w.source_type==='scanner'?(w.scanner_name||'Scanner'):'Profil-SMB-Inbox';
    const el=document.createElement('div'); el.className='item';
    el.innerHTML='<strong>'+escapeHtml(w.name)+'</strong> '+
      '<span class="badge '+(w.enabled?'ok':'off')+'">'+(w.enabled?'aktiv':'deaktiviert')+'</span>'+
      '<div class="muted">'+escapeHtml(source)+' → '+escapeHtml(w.profile_name||'?')+' → '+escapeHtml(w.destination_name||'?')+'</div>'+
      '<div id="workflowRun-'+w.id+'" class="muted" style="margin-top:6px"></div>';
    const actions=document.createElement('div'); actions.className='actions';
    if(w.source_type==='scanner'){
      const run=document.createElement('button'); run.textContent='Workflow starten'; run.onclick=()=>runWorkflow(w); actions.appendChild(run);
    }
    const edit=document.createElement('button'); edit.className='secondary'; edit.textContent='Bearbeiten'; edit.onclick=()=>editWorkflow(w);
    const toggle=document.createElement('button'); toggle.className='secondary'; toggle.textContent=w.enabled?'Deaktivieren':'Aktivieren'; toggle.onclick=()=>toggleWorkflow(w);
    const del=document.createElement('button'); del.className='danger'; del.textContent='Löschen'; del.onclick=()=>deleteWorkflow(w);
    actions.append(edit,toggle,del); el.appendChild(actions); box.appendChild(el);
  }
}

async function testscan(){
  const id=document.getElementById('scanScanner').value;
  const out=document.getElementById('scanResult');
  if(!id){out.innerHTML='<span class="err">Kein aktiver Scanner gespeichert.</span>';return;}
  out.innerHTML='<span class="warn">Scan läuft…</span>';
  try{
    const body={dpi:Number(document.getElementById('dpi').value),duplex:document.getElementById('duplex').value==='true',color_mode:document.getElementById('color').value};
    const r=await api('/api/scanners/'+id+'/testscan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    out.innerHTML='<span class="ok">Scan abgeschlossen.</span> <a class="btn secondary" target="_blank" href="'+r.file_url+'">PDF öffnen</a>';
    await loadJobs();
  }catch(e){out.innerHTML='<span class="err">'+escapeHtml(e.message)+'</span>'; await loadJobs();}
}
async function loadJobs(){
  const data=await api('/api/jobs');
  const box=document.getElementById('jobs'); box.innerHTML='';
  if(!data.length){box.innerHTML='<span class="muted">Noch keine ScanJobs.</span>';return;}
  for(const j of data){
    const el=document.createElement('div'); el.className='item';
    const statusClass=(j.status==='finished'||j.status==='imported'||j.status==='delivered')?'ok':(j.status==='error'||j.status==='delivery_error')?'err':'off';
    const filename=(j.output_path||'').split('/').pop()||'—';
    el.innerHTML='<div class="jobgrid">'+
      '<div><strong>Job '+j.id+'</strong></div>'+
      '<div><span class="badge '+statusClass+'">'+escapeHtml(j.status)+'</span></div>'+
      '<div><div>'+escapeHtml(filename)+'</div><div class="muted">'+escapeHtml(j.created_at||'')+
      (j.profile_name?' · Profil: '+escapeHtml(j.profile_name):'')+
      (j.source==='profile-smb'?' · SMB-Inbox':'')+
      (j.blank_pages_removed?' · Leerseiten entfernt: '+j.blank_pages_removed:'')+
      (j.documents&&j.documents.length>1?' · Dokumente: '+j.documents.length:'')+
      (j.separation_markers&&j.separation_markers.length?' · Trenner: '+j.separation_markers.length:'')+
      (j.image_processing&&j.image_processing.pages_deskewed?' · begradigt: '+j.image_processing.pages_deskewed:'')+
      (j.image_processing&&j.image_processing.pages_rotated?' · gedreht: '+j.image_processing.pages_rotated:'')+
      (j.image_processing&&j.image_processing.pages_cropped?' · zugeschnitten: '+j.image_processing.pages_cropped:'')+
      (j.ocr&&j.ocr.documents?' · OCR: '+j.ocr.documents+' Dok. / '+j.ocr.characters+' Zeichen':'')+
      (j.documents&&j.documents.some(d=>d.final_filename)?' · Dateinamen erzeugt':'')+
      (j.deliveries&&j.deliveries.length?' · Versand: '+j.deliveries.map(d=>d.status).join(', '):'')+'</div>'+
      (j.separation_markers&&j.separation_markers.length?
        '<div class="muted">Erkannte Trenner: '+j.separation_markers.map(m=>'S.'+m.page+' '+escapeHtml(m.type)+': '+escapeHtml(m.value)).join(' | ')+'</div>':'')+
      (j.error?'<div class="err"><strong>Fehler:</strong> '+escapeHtml(j.error)+'</div>':'')+'</div>'+
      '<div>'+((j.documents&&j.documents.length>1)
        ? j.documents.map(d=>
            '<div style="margin-bottom:6px">'+
            '<a class="btn secondary" target="_blank" href="'+d.file_url+'">Dok. '+d.sequence+'</a> '+
            (j.ocr&&j.ocr.documents?'<a class="btn secondary" target="_blank" href="/api/job-documents/'+d.id+'/ocr">OCR '+d.sequence+'</a> ':'')+
            (d.final_filename?'<span class="muted">'+escapeHtml(d.final_filename)+'</span>':'')+
            '</div>'
          ).join('')
        : ((j.status==='finished'||j.status==='imported'||j.status==='delivered'||j.status==='delivery_error'||j.status==='separated')?'<a class="btn secondary" target="_blank" href="/api/jobs/'+j.id+'/file">PDF öffnen</a>':''))+'</div>'+
      '</div>';
    box.appendChild(el);
  }
}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
init();
</script>
